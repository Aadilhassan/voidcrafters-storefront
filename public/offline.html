<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<title>Offline — Voidcrafters</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e8e6e1;
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  img { width: 88px; height: 88px; opacity: 0.7; margin-bottom: 1.5rem; }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #e5383b;
    margin-bottom: 1rem;
  }
  h1 {
    font-size: 1.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  p { color: #a7a5a0; font-size: 0.95rem; margin-bottom: 2rem; max-width: 22rem; }
  button {
    background: #8a0303;
    color: #e8e6e1;
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.9rem 2.5rem;
    cursor: pointer;
  }
  button:hover { background: #c1121f; }
</style>
</head>
<body>
  <img src="/brand/sigil-bone-blood.svg" alt="" />
  <p class="kicker">The void is silent</p>
  <h1>You&rsquo;re offline</h1>
  <p>The crypt needs a connection. Check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
